te-columns:repeat(4,minmax(0,1fr))}.palette small{font-size:9px}.toolbar{padding:12px}}@media(max-width:620px){.palettes{display:flex;overflow-x:auto;padding-bottom:5px}.palette{flex:0 0 148px}.heading h1{font-size:16px}.controls{gap:8px}.opinion{flex-basis:100%;order:3}.notice{display:none}.segments button{padding:5px 8px}.heading p{font-size:11px}}

<body>
<header class="toolbar">
  <div class="heading">
    <h1>포트폴리오 디자인 설정</h1>
    <button class="fold-palettes" type="button" aria-expanded="true">색 조합 접기</button>
    <div class="segments collections" aria-label="색 조합 모음">
      <button data-collection="images">첨부 이미지 12종</button>
      <button data-collection="originals">원래 컬러</button>
      <button data-collection="more">추가 O–V</button>
      <button data-collection="new">G–N</button>
      <button data-collection="existing">A–F</button>
    </div>
    <p>첨부 이미지 + Colorion <a href="https://2colors.colorion.co/" target="_blank" rel="noopener noreferrer">1</a> · <a href="https://2colors.colorion.co/page/2" target="_blank" rel="noopener noreferrer">2</a> · <a href="https://2colors.colorion.co/page/3" target="_blank" rel="noopener noreferrer">3</a></p>
  </div>
  <div class="palettes" aria-label="색 조합 선택"></div>
  <div class="controls">
    <nav class="segments sections" aria-label="확인할 화면">
      <button data-section="top">프로필</button>
      <button data-section="projects">프로젝트</button>
      <button data-section="fms">FMS</button>
      <button data-section="plc">PLC</button>
    </nav>
    <div class="segments devices" aria-label="화면 너비">
      <button data-device="desktop" aria-pressed="true">PC</button>
      <button data-device="mobile" aria-pressed="false">모바일</button>
    </div>
    <p class="opinion" aria-live="polite"></p>
    <span class="notice">색을 누르면 아래 실제 페이지에 적용됩니다.</span>
  </div>
  <div class="card-settings" aria-label="카드 디자인 조절">
    <label class="range-setting" for="shadow-strength">그림자 강도<input id="shadow-strength" type="range" min="0" max="30" step="1" value="12"><output for="shadow-strength">12%</output></label>
    <label class="range-setting" for="shadow-blur">그림자 퍼짐<input id="shadow-blur" type="range" min="0" max="48" step="1" value="18"><output for="shadow-blur">18px</output></label>
    <label class="range-setting" for="card-radius">모서리 둥글기<input id="card-radius" type="range" min="0" max="32" step="1" value="12"><output for="card-radius">12px</output></label>
    <div class="settings-actions">
      <button type="button" id="reset-cards">카드 초기화</button>
      <button type="button" id="copy-settings">설정 링크 복사</button>
      <button type="button" class="download" id="download-theme">설정 CSS 받기</button>
    </div>
    <span class="settings-status" role="status"></span>
  </div>
  <details class="advanced-settings" open>
    <summary>그림자 위치 · 테두리 · 프로필 사진</summary>
    <div class="advanced-grid">
      <fieldset><legend>그림자 위치</legend>
        <label class="range-setting" for="shadow-x">가로 위치<input id="shadow-x" type="range" min="-24" max="24" value="0"><output for="shadow-x">0px</output></label>
        <label class="range-setting" for="shadow-y">세로 위치<input id="shadow-y" type="range" min="-24" max="24" value="6"><output for="shadow-y">6px</output></label>
      </fieldset>
      <fieldset><legend>카드 테두리</legend>
        <label class="range-setting" for="border-width">두께<input id="border-width" type="range" min="0" max="5" value="1"><output for="border-width">1px</output></label>
        <div class="color-setting"><label for="border-color">색상 <input id="border-color" type="color" value="#dfe4eb"></label><label><input id="border-auto" type="checkbox" checked>팔레트 자동</label></div>
      </fieldset>
      <fieldset><legend>프로필 사진 크기</legend>
        <label class="range-setting" for="profile-size">PC 너비<input id="profile-size" type="range" min="90" max="280" value="190"><output for="profile-size">190px</output></label>
        <label class="range-setting" for="profile-mobile">모바일 너비<input id="profile-mobile" type="range" min="140" max="320" value="240"><output for="profile-mobile">240px</output></label>
      </fieldset>
    </div>
  </details>
  <p class="settings-help">조절한 값은 이 브라우저에 저장됩니다. 설정 링크로 같은 모습을 공유할 수 있습니다. 사이트 기본 디자인은 내려받은 CSS를 반영한 뒤 배포하면 바뀝니다.</p>
</header>
<main class="stage"><iframe title="현재 포트폴리오 색 조합 미리보기"></iframe></main>

document.getElementById('border-color').addEventListener('input',event=>{cardSettings.borderColor=event.target.value;cardSettings.borderAuto=false;syncCardControls();applyTheme();});
document.getElementById('border-auto').addEventListener('change',event=>{cardSettings.borderAuto=event.target.checked;applyTheme();});
document.getElementById('reset-cards').addEventListener('click',()=>{cardSettings={...cardDefaults};syncCardControls();applyTheme();document.querySelector('.settings-status').textContent='카드 설정을 초기화했습니다.';});
document.querySelector('.fold-palettes').addEventListener('click',event=>{const collapsed=document.querySelector('.toolbar').classList.toggle('collapsed');event.target.setAttribute('aria-expanded',String(!collapsed));event.target.textContent=collapsed?'색 조합 펼치기':'색 조합 접기';});
document.getElementById('copy-settings').addEventListener('click',async()=>{
  const status=document.querySelector('.settings-status');
  try{await navigator.clipboard.writeText(location.href);status.textContent='설정 링크를 복사했습니다.';}catch{status.textContent='주소창의 링크를 복사해 주세요.';}
});
document.getElementById('download-theme').addEventListener('click',async()=>{
  const status=document.querySelector('.settings-status');
  try{
    const t=themes.find(t=>t.id===current);
    let css=t.passThrough?'':themeCss(t);
    if(t.passThrough){const response=await fetch('styles.css');if(!response.ok)throw Error('Theme unavailable');css=await response.text();}
    const url=URL.createObjectURL(new Blob([`/* ${t.name} | shadow ${cardSettings.shadow}% | blur ${cardSettings.blur}px | radius ${cardSettings.radius}px */\n`,css,'\n',cardCss(cardSettings)],{type:'text/css;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download='theme-original.css';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    status.textContent='현재 디자인의 CSS를 내려받았습니다.';
  }catch{status.textContent='내려받기에 실패했습니다. 잠시 후 다시 시도해 주세요.';}
});
frame.addEventListener('load',()=>{ready=true;applyTheme();goToSection();});
frame.src='index.html#'+(section==='top'?'':section);
new ResizeObserver(()=>document.documentElement.style.setProperty('--toolbar-height',document.querySelector('.toolbar').getBoundingClientRect().height+'px')).observe(document.querySelector('.toolbar'));
syncCardControls();
updateToolbar();
</script>
</body>
</html>
